-pehchan ki ustani baithi hain."],     a:["الف: سلام کرکے اپنی جگہ پر بیٹھنا.","Alif: Salam karke apni jagah par baithna."],     b:["ب: انہیں دیکھ کر بھی کچھ نہ کہنا.","Be: Unhein dekh kar bhi kuch na kehna."],     activity:["آج گھر یا کلاس میں کسی جان پہچان والے کو مسکرا کر سلام کرو.","Aaj ghar ya class mein kisi jaan-pehchan walay ko muskura kar salam karo."],     question:["جب کوئی تمہیں خوشی سے سلام کرتا ہے تو تمہیں کیسا لگتا ہے؟","Jab koi tumhein khushi se salam karta hai to tumhein kaisa lagta hai?"],     palette:["#81b5d7","#315d83","#e8f5ff","#ffe1a4"],     objects:["door","board","bag","stack","pencil"]   },   {     title:["کارڈ ۲: سچ بولنے کی ہمت","Card 2: Sach bolne ki himmat"],     situation:["تم سے کھیلتے ہوئے پانی کا گلاس گر جاتا ہے۔ کوئی نہیں جانتا کہ کیا ہوا.","Tum se khelte hue pani ka glass gir jata hai. Koi nahin jaanta ke kya hua."],     a:["الف: کہنا کہ گلاس خود ہی گر گیا.","Alif: Kehna ke glass khud hi gir gaya."],     b:["ب: سچ بتانا اور پانی صاف کرنے میں مدد کرنا.","Be: Sach batana aur pani saaf karne mein madad karna."],     activity:["کسی بڑے کو بتاؤ کہ غلطی ہونے پر سچ کہنا کیوں مشکل لگ سکتا ہے.","Kisi baray ko batao ke ghalti hone par sach kehna kyun mushkil lag sakta hai."],     question:["سچ بتانے کے بعد غلطی کو ٹھیک کرنے کے لیے کیا کیا جا سکتا ہے؟","Sach batane ke baad ghalti ko theek karne ke liye kya kya kiya ja sakta hai?"],     palette:["#80c5cb","#367880","#e7f8f8","#ffdcad"],     objects:["glass","drop","desk","cloth","star"]   },   {     title:["کارڈ ۳: پہلے اجازت","Card 3: Pehle ijazat"],     situation:["تمہیں ایک خوب صورت رنگین پنسل چاہیے۔ وہ تمہارے دوست کے بستے میں ہے.","Tumhein ek khoobsurat rangeen pencil chahiye. Woh tumhare dost ke baste mein hai."],     a:["الف: دوست سے پوچھنا کہ کیا تم اس کی پنسل استعمال کر سکتے ہو.","Alif: Dost se poochna ke kya tum us ki pencil istemal kar sakte ho."],     b:["ب: بغیر پوچھے بستے سے پنسل نکال لینا.","Be: Baghair poochay baste se pencil nikal lena."],     activity:["آج کسی کی چیز لینے سے پہلے صاف لفظوں میں اجازت مانگو.","Aaj kisi ki cheez lene se pehle saaf lafzon mein ijazat mango."],     question:["اگر دوست اجازت نہ دے تو تم کیا کر سکتے ہو؟","Agar dost ijazat na de to tum kya kar sakte ho?"],     palette:["#bd9cdb","#775393","#f4eefe","#ffdda2"],     objects:["bag","pencilbox","pencil","notebook","star"]   },   {     title:["کارڈ ۴: امانت کا خیال","Card 4: Amanat ka khayal"],     situation:["تمہارے دوست نے اپنی کتاب کچھ دیر کے لیے تمہیں دی ہے۔ چھٹی ہونے والی ہے.","Tumhare dost ne apni kitab kuch der ke liye tumhein di hai. Chhutti hone wali hai."],     a:["الف: کتاب کو سنبھال کر رکھنا اور وقت پر واپس کرنا.","Alif: Kitab ko sambhal kar rakhna aur waqt par wapas karna."],     b:["ب: کتاب کہیں رکھ کر بھول جانا.","Be: Kitab kahin rakh kar bhool jana."],     activity:["اپنی کسی کتاب یا کھلونے کو استعمال کے بعد اس کی جگہ پر رکھو.","Apni kisi kitab ya khilonay ko istemal ke baad us ki jagah par rakho."],     question:["اگر ادھار لی ہوئی چیز گم ہو جائے تو کیا کہنا چاہیے؟","Agar udhaar li hui cheez gum ho jaye to kya kehna chahiye?"],     palette:["#d1b077","#85643d","#fff4e2","#bce5d4"],     objects:["shelf","book","clock","stack","star"]   },   {     title:["کارڈ ۵: دل سے شکریہ","Card 5: Dil se shukriya"],     situation:["تمہارے جوتے کا تسمہ کھل گیا ہے۔ کوئی اسے باندھنے میں تمہاری مدد کرتا ہے.","Tumhare jootay ka tasma khul gaya hai. Koi usay bandhne mein tumhari madad karta hai."],     a:["الف: مدد ملنے کے بعد فوراً بھاگ جانا.","Alif: Madad milne ke baad foran bhaag jana."],     b:["ب: اس شخص کا شکریہ ادا کرنا.","Be: Us shakhs ka shukriya ada karna."],     activity:["آج کسی کی چھوٹی سی مدد پر بھی شکریہ ادا کرو.","Aaj kisi ki chhoti si madad par bhi shukriya ada karo."],     question:["تم کن کاموں کے لیے دوسروں کا شکریہ ادا کر سکتے ہو؟","Tum kin kaamon ke liye doosron ka shukriya ada kar sakte ho?"],     palette:["#e7a4b7","#a35c72","#fff0f4","#ffdea6"],     objects:["shoe","mail","heart","ribbon","star"]   },   {     title:["کارڈ ۶: معافی کے بعد اصلاح","Card 6: Maafi ke baad islaah"],     situation:["تم جلدی میں دوست کی بنائی ہوئی کاغذ کی کشتی پر ہاتھ رکھ دیتے ہو۔ کشتی دب جاتی ہے.","Tum jaldi mein dost ki banai hui kaghaz ki kashti par haath rakh dete ho. Kashti dab jati hai."],     a:["الف: غلطی ماننا، معافی مانگنا اور نئی کشتی بنانے میں مدد کی پیشکش کرنا.","Alif: Ghalti maanna, maafi maangna aur nai kashti banane mein madad ki peshkash karna."],     b:["ب: کہنا کہ اس سے کوئی فرق نہیں پڑتا.","Be: Kehna ke is se koi farq nahin parta."],     activity:["یہ جملہ اپنے الفاظ میں کہنے کی مشق کرو: «مجھ سے غلطی ہوئی۔ میں اسے ٹھیک کرنے میں کیسے مدد کر سکتا/سکتی ہوں؟»","Yeh jumla apne alfaaz mein kehne ki mashq karo: \\"Mujh se ghalti hui. Main isay theek karne mein kaise madad kar sakta/sakti hoon?\\""],     question:["صرف «معاف کرنا» کہنے کے علاوہ تم کیا کر سکتے ہو؟","Sirf \\"maaf karna\\" kehne ke ilawa tum kya kar sakte ho?"],     palette:["#8ab7da","#416e92","#edf7ff","#ffe0b7"],     objects:["boat","notebook","pencil","heart","drop"]   },   {     title:["کارڈ ۷: اپنی باری کا انتظار","Card 7: Apni baari ka intezar"],     situation:["پارک میں جھولا خالی ہونے کا انتظار ہے۔ دو بچے تم سے پہلے قطار میں کھڑے ہیں.","Park mein jhoola khaali hone ka intezar hai. Do bachay tum se pehle qatar mein kharay hain."],     a:["الف: قطار میں کھڑے ہو کر اپنی باری کا انتظار کرنا.","Alif: Qatar mein kharay ho kar apni baari ka intezar karna."],     b:["ب: آگے جا کر فوراً جھولے پر بیٹھ جانا.","Be: Aagay ja kar foran jhoolay par baith jana."],     activity:["آج کسی کھیل یا کام میں اپنی باری آنے تک انتظار کرو.","Aaj kisi khel ya kaam mein apni baari aane tak intezar karo."],     question:["انتظار آسان بنانے کے لیے تم اس دوران کیا کر سکتے ہو؟","Intezar aasan banane ke liye tum is duran kya kar sakte ho?"],     palette:["#98c6aa","#4b8164","#edf9ef","#ffe0a2"],     objects:["swing","clock","flower","star","flower"]   },   {     title:["کارڈ ۸: نرم لہجہ","Card 8: Narm lehja"],     situation:["تم اور تمہارا دوست ایک کھیل کے لیے الگ الگ اصول چاہتے ہو.","Tum aur tumhara dost ek khel ke liye alag alag usool chahte ho."],     a:["الف: اونچی آواز میں کہنا کہ صرف میری بات مانو.","Alif: Oonchi aawaz mein kehna ke sirf meri baat mano."],     b:["ب: سکون سے اپنی بات بتانا اور دوست کی بات بھی سننا.","Be: Sukoon se apni baat batana aur dost ki baat bhi sunna."],     activity:["نرم آواز میں یہ جملہ کہنے کی مشق کرو: «میری رائے کچھ اور ہے۔ ہم دونوں کیا کر سکتے ہیں؟»","Narm aawaz mein yeh jumla kehne ki mashq karo: \\"Meri raye kuch aur hai. Hum dono kya kar sakte hain?\\""],     question:["ایک ہی بات نرم اور سخت لہجے میں سن کر کیسا فرق محسوس ہوتا ہے؟","Ek hi baat narm aur sakht lehjay mein sun kar kaisa farq mehsoos hota hai?"],     palette:["#b7a1d9","#695590","#f4effd","#ffdfa6"],     objects:["bubble","game","bubble","star","notebook"]   },   {     title:["کارڈ ۹: پوری بات سننا","Card 9: Poori baat sunna"],     situation:["تمہاری بہن اپنے دن کی ایک بات بتا رہی ہے۔ تمہیں بھی کچھ کہنا یاد آ گیا ہے.","Tumhari behen apne din ki ek baat bata rahi hai. Tumhein bhi kuch kehna yaad aa gaya hai."],     a:["الف: اس کی بات پوری ہونے دینا، پھر اپنی بات کہنا.","Alif: Us ki baat poori hone dena, phir apni baat kehna."],     b:["ب: فوراً بیچ میں بولنا شروع کر دینا.","Be: Foran beech mein bolna shuru kar dena."],     activity:["آج کسی کی بات مکمل سنو، پھر اس سے ایک سوال پوچھو.","Aaj kisi ki baat mukammal suno, phir us se ek sawal poochho."],     question:["تمہیں کیسے پتا چلتا ہے کہ کوئی واقعی تمہاری بات سن رہا ہے؟","Tumhein kaise pata chalta hai ke koi waqai tumhari baat sun raha hai?"],     palette:["#80bdc0","#397c7e","#eaf8f8","#ffdfaa"],     objects:["bubble","notebook","stack","bubble","star"]   },   {     title:["کارڈ ۱۰: اپنی جگہ صاف رکھنا","Card 10: Apni jagah saaf rakhna"],     situation:["تم تصویریں بنا چکے ہو۔ کاغذ کے چھوٹے ٹکڑے میز پر رہ گئے ہیں.","Tum tasveerein bana chukay ho. Kaghaz ke chhotay tukray mez par reh gaye hain."],     a:["الف: ٹکڑے سمیٹ کر کچرے کی ٹوکری میں ڈالنا.","Alif: Tukray samet kar kachray ki tokri
